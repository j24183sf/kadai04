<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>演習課題4-1：九九の表</title>
</head>
<body>
    <script>
    for(let i = 1; i <= 9; i = i + 1){
      let line = "";
      for(let j = 1; j <= 9; j = j + 1){
        line = line +(i * j) + " ";
      }
  console.log(line);
    }
  </script>
</body>
</html>
